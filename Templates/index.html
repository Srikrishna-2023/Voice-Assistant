<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>JARVIS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --cyan: #00f5ff;
      --cyan-dim: #00b8c4;
      --cyan-dark: #003d47;
      --bg: #020d10;
      --bg2: #041a20;
      --text: #cff8ff;
      --text-dim: #4a9aa8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 245, 255, 0.015) 2px,
        rgba(0, 245, 255, 0.015) 4px
      );
      pointer-events: none;
      z-index: 9999;
    }

    /* Header */
    .jarvis-header {
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 245, 255, 0.15);
      background: rgba(4, 26, 32, 0.8);
      backdrop-filter: blur(10px);
    }

    .jarvis-logo {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 1.4rem;
      letter-spacing: 0.3em;
      color: var(--cyan);
      text-shadow: 0 0 20px var(--cyan), 0 0 40px var(--cyan-dim);
    }

    .jarvis-logo span {
      color: var(--text-dim);
      font-size: 0.7rem;
      display: block;
      letter-spacing: 0.2em;
      font-weight: 400;
    }

    .status-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      padding: 0.3rem 1rem;
      border: 1px solid var(--cyan-dim);
      border-radius: 2px;
      color: var(--cyan);
      background: rgba(0, 245, 255, 0.05);
      transition: all 0.3s;
    }

    .status-badge.listening {
      color: #00ff88;
      border-color: #00ff88;
      background: rgba(0, 255, 136, 0.08);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
    }

    .status-badge.processing {
      color: #ffcc00;
      border-color: #ffcc00;
      background: rgba(255, 204, 0, 0.08);
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
    }

    .status-badge.speaking {
      color: var(--cyan);
      border-color: var(--cyan);
      background: rgba(0, 245, 255, 0.08);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.3);
    }

    /* Main layout */
    .main-layout {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* Orb section */
    .orb-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid background */
    .orb-section::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    /* Orb */
    .orb-container {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .orb-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(0, 245, 255, 0.3);
      animation: rotate 8s linear infinite;
    }

    .orb-ring-1 {
      width: 100%;
      height: 100%;
      border-color: rgba(0, 245, 255, 0.2);
      animation-duration: 10s;
    }

    .orb-ring-2 {
      width: 85%;
      height: 85%;
      border-color: rgba(0, 245, 255, 0.3);
      animation-duration: 7s;
      animation-direction: reverse;
    }

    .orb-ring-3 {
      width: 70%;
      height: 70%;
      border-color: rgba(0, 245, 255, 0.4);
      animation-duration: 5s;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .orb-core {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%,
        rgba(0, 245, 255, 0.4),
        rgba(0, 180, 200, 0.2),
        rgba(0, 50, 70, 0.8)
      );
      border: 1px solid rgba(0, 245, 255, 0.5);
      box-shadow:
        0 0 30px rgba(0, 245, 255, 0.3),
        0 0 60px rgba(0, 245, 255, 0.15),
        inset 0 0 30px rgba(0, 245, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s;
      z-index: 2;
    }

    .orb-core svg {
      width: 40px;
      height: 40px;
      fill: var(--cyan);
      opacity: 0.9;
      filter: drop-shadow(0 0 8px var(--cyan));
    }

    /* Pulse rings when listening */
    .orb-container.listening .orb-core {
      box-shadow:
        0 0 50px rgba(0, 255, 136, 0.5),
        0 0 100px rgba(0, 255, 136, 0.2),
        inset 0 0 30px rgba(0, 255, 136, 0.15);
      border-color: rgba(0, 255, 136, 0.7);
      background: radial-gradient(circle at 35% 35%,
        rgba(0, 255, 136, 0.4),
        rgba(0, 180, 100, 0.2),
        rgba(0, 50, 30, 0.8)
      );
    }

    .orb-container.listening .orb-core svg {
      fill: #00ff88;
      filter: drop-shadow(0 0 8px #00ff88);
    }

    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(0, 255, 136, 0.5);
      animation: pulse-out 1.5s ease-out infinite;
      opacity: 0;
    }

    .pulse-ring:nth-child(1) { animation-delay: 0s; }
    .pulse-ring:nth-child(2) { animation-delay: 0.5s; }
    .pulse-ring:nth-child(3) { animation-delay: 1s; }

    @keyframes pulse-out {
      0% { width: 140px; height: 140px; opacity: 0.8; }
      100% { width: 280px; height: 280px; opacity: 0; }
    }

    .orb-container.processing .orb-core {
      box-shadow:
        0 0 50px rgba(255, 204, 0, 0.4),
        0 0 100px rgba(255, 204, 0, 0.15),
        inset 0 0 30px rgba(255, 204, 0, 0.1);
      border-color: rgba(255, 204, 0, 0.6);
    }

    /* Status text */
    .orb-status {
      margin-top: 2rem;
      font-family: 'Orbitron', monospace;
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      color: var(--text-dim);
      text-transform: uppercase;
      transition: all 0.3s;
    }

    .orb-status.listening { color: #00ff88; text-shadow: 0 0 10px #00ff88; }
    .orb-status.processing { color: #ffcc00; text-shadow: 0 0 10px #ffcc00; }
    .orb-status.speaking { color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }

    .orb-hint {
      margin-top: 0.75rem;
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      opacity: 0.6;
    }

    /* Chat panel */
    .chat-panel {
      width: 380px;
      border-left: 1px solid rgba(0, 245, 255, 0.1);
      display: flex;
      flex-direction: column;
      background: rgba(4, 26, 32, 0.6);
    }

    .chat-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(0, 245, 255, 0.1);
      font-family: 'Orbitron', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--text-dim);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      scrollbar-width: thin;
      scrollbar-color: var(--cyan-dark) transparent;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: var(--cyan-dark); border-radius: 2px; }

    .msg {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      font-size: 0.8rem;
      line-height: 1.5;
      border-radius: 2px;
      animation: msg-in 0.2s ease-out;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-assistant {
      align-self: flex-start;
      background: rgba(0, 245, 255, 0.06);
      border: 1px solid rgba(0, 245, 255, 0.15);
      color: var(--text);
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(0, 245, 255, 0.12);
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: var(--cyan);
    }

    .msg-time {
      font-size: 0.6rem;
      color: var(--text-dim);
      margin-top: 0.25rem;
      opacity: 0.6;
    }

    /* Input area */
    .chat-input-area {
      padding: 1rem;
      border-top: 1px solid rgba(0, 245, 255, 0.1);
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: rgba(0, 245, 255, 0.04);
      border: 1px solid rgba(0, 245, 255, 0.2);
      color: var(--text);
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      border-radius: 2px;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 10px rgba(0, 245, 255, 0.1);
    }

    .chat-input::placeholder { color: var(--text-dim); opacity: 0.5; }

    .send-btn {
      background: rgba(0, 245, 255, 0.1);
      border: 1px solid rgba(0, 245, 255, 0.3);
      color: var(--cyan);
      font-family: 'Orbitron', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      padding: 0.5rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: rgba(0, 245, 255, 0.2);
      box-shadow: 0 0 15px rgba(0, 245, 255, 0.2);
    }

    /* Connection indicator */
    .conn-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
      display: inline-block;
      margin-right: 0.5rem;
      transition: background 0.3s;
    }

    .conn-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 6px #00ff88;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="jarvis-header">
    <div class="jarvis-logo">
      J.A.R.V.I.S
      <span>Just A Rather Very Intelligent System</span>
    </div>
    <div class="d-flex align-items-center gap-3">
      <span class="status-badge" id="statusBadge">STANDBY</span>
      <span style="font-size:0.75rem; color: var(--text-dim);">
        <span class="conn-dot" id="connDot"></span>
        <span id="connText">OFFLINE</span>
      </span>
    </div>
  </div>

  <!-- Main -->
  <div class="main-layout">

    <!-- Orb -->
    <div class="orb-section">
      <div class="orb-container" id="orbContainer" onclick="handleOrbClick()">
        <!-- Pulse rings (shown when listening) -->
        <div class="pulse-ring" id="pulse1"></div>
        <div class="pulse-ring" id="pulse2"></div>
        <div class="pulse-ring" id="pulse3"></div>

        <!-- Rotating rings -->
        <div class="orb-ring orb-ring-1"></div>
        <div class="orb-ring orb-ring-2"></div>
        <div class="orb-ring orb-ring-3"></div>

        <!-- Core -->
        <div class="orb-core" id="orbCore">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm0 2a8 8 0 110 16A8 8 0 0112 4zm0 3a1 1 0 00-1 1v4a1 1 0 00.553.894l3 1.5a1 1 0 00.894-1.788L13 11.382V8a1 1 0 00-1-1z"/>
          </svg>
        </div>
      </div>

      <div class="orb-status" id="orbStatus">STANDBY</div>
      <div class="orb-hint" id="orbHint">SAY "JARVIS" OR CLICK TO ACTIVATE</div>
    </div>

    <!-- Chat Panel -->
    <div class="chat-panel">
      <div class="chat-header">// COMM LOG</div>
      <div class="chat-messages" id="chatMessages">
        <div class="msg msg-assistant">
          <div>JARVIS online. Awaiting your command.</div>
          <div class="msg-time" id="initTime"></div>
        </div>
      </div>
      <div class="chat-input-area">
        <input
          type="text"
          class="chat-input"
          id="chatInput"
          placeholder="ENTER COMMAND..."
          onkeydown="handleKey(event)"
        />
        <button class="send-btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Set init time
    document.getElementById('initTime').textContent = new Date().toLocaleTimeString();

    let ws = null;
    let isConnected = false;
    let reconnectTimer = null;
    let isListening = false;

    // ── WebSocket ──────────────────────────────────────────
    function connect() {
      if (isConnected) return;
      ws = new WebSocket('ws://localhost:8080');

      ws.onopen = () => {
        isConnected = true;
        clearTimeout(reconnectTimer);
        setConnected(true);
        console.log('Connected to JARVIS backend');
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.type === 'status') {
          updateState(data.state);
        }
        if (data.type === 'speaking') {
          addMessage('assistant', data.text);
        }
        if (data.type === 'done') {
          updateState('ready');
        }
        if (data.type === 'error') {
          addMessage('assistant', 'ERROR: ' + data.message);
          updateState('ready');
        }
      };

      ws.onclose = () => {
        isConnected = false;
        setConnected(false);
        reconnectTimer = setTimeout(connect, 2000);
      };

      ws.onerror = () => {
        isConnected = false;
      };
    }

    // ── UI State ───────────────────────────────────────────
    function setConnected(connected) {
      const dot = document.getElementById('connDot');
      const text = document.getElementById('connText');
      if (connected) {
        dot.classList.add('connected');
        text.textContent = 'ONLINE';
      } else {
        dot.classList.remove('connected');
        text.textContent = 'OFFLINE';
      }
    }

    function updateState(state) {
      const orb = document.getElementById('orbContainer');
      const status = document.getElementById('orbStatus');
      const badge = document.getElementById('statusBadge');
      const hint = document.getElementById('orbHint');

      orb.className = 'orb-container';
      status.className = 'orb-status';
      badge.className = 'status-badge';

      const pulses = document.querySelectorAll('.pulse-ring');

      if (state === 'listening') {
        orb.classList.add('listening');
        status.classList.add('listening');
        badge.classList.add('listening');
        status.textContent = 'LISTENING';
        badge.textContent = 'LISTENING';
        hint.textContent = 'SPEAK NOW...';
        pulses.forEach(p => p.style.display = 'block');
        isListening = true;
      } else if (state === 'processing') {
        orb.classList.add('processing');
        status.classList.add('processing');
        badge.classList.add('processing');
        status.textContent = 'PROCESSING';
        badge.textContent = 'PROCESSING';
        hint.textContent = 'ANALYZING...';
        pulses.forEach(p => p.style.display = 'none');
        isListening = false;
      } else if (state === 'speaking') {
        status.classList.add('speaking');
        badge.classList.add('speaking');
        status.textContent = 'SPEAKING';
        badge.textContent = 'SPEAKING';
        hint.textContent = 'JARVIS IS RESPONDING...';
        pulses.forEach(p => p.style.display = 'none');
        isListening = false;
      } else {
        status.textContent = 'STANDBY';
        badge.textContent = 'STANDBY';
        hint.textContent = 'SAY "JARVIS" OR CLICK TO ACTIVATE';
        pulses.forEach(p => p.style.display = 'none');
        isListening = false;
      }
    }

    // ── Messages ───────────────────────────────────────────
    function addMessage(type, text) {
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = `msg msg-${type}`;
      div.innerHTML = `
        <div>${text}</div>
        <div class="msg-time">${new Date().toLocaleTimeString()}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    // ── Actions ────────────────────────────────────────────
    function sendMessage() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage('user', text);
      input.value = '';

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'text_command', text }));
      } else {
        addMessage('assistant', 'NOT CONNECTED TO BACKEND.');
      }
    }

    function handleKey(event) {
      if (event.key === 'Enter') sendMessage();
    }

    function handleOrbClick() {
      if (!isConnected) return;
      if (isListening) {
        ws.send(JSON.stringify({ type: 'stop_listening' }));
      } else {
        ws.send(JSON.stringify({ type: 'start_listening' }));
      }
    }

    // ── Start ──────────────────────────────────────────────
    connect();
  </script>
</body>
</html>
